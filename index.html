<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#E7ECF5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C1018" media="(prefers-color-scheme: dark)">
  <meta name="description" content="已收藏的 X 帖子，按主题翻看、检索，点开即可阅读摘要、笔记与原文。">
  <title>X 帖子收藏卡</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("x-flashcards-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#deck">跳到卡片</a>

  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-seal" aria-hidden="true">藏</span>
      <div class="brand-text">
        <h1>X 帖子收藏卡</h1>
        <p class="brand-sub" id="brandSub">正在载入收藏…</p>
      </div>
    </div>
    <button type="button" class="shape-btn" id="themeToggle" aria-label="切换深色或浅色主题" title="切换主题">
      <svg class="icon icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm0-5.2a.9.9 0 0 1 .9.9v1.4a.9.9 0 1 1-1.8 0V3.7a.9.9 0 0 1 .9-.9Zm0 16.6a.9.9 0 0 1 .9.9v1.4a.9.9 0 1 1-1.8 0v-1.4a.9.9 0 0 1 .9-.9ZM3.7 11.1h1.4a.9.9 0 1 1 0 1.8H3.7a.9.9 0 1 1 0-1.8Zm15.2 0h1.4a.9.9 0 1 1 0 1.8h-1.4a.9.9 0 1 1 0-1.8ZM6.16 5.25a.9.9 0 0 1 1.27 0l.99.99a.9.9 0 0 1-1.27 1.27l-.99-.99a.9.9 0 0 1 0-1.27Zm9.42 9.42a.9.9 0 0 1 1.27 0l.99.99a.9.9 0 1 1-1.27 1.27l-.99-.99a.9.9 0 0 1 0-1.27Zm1.27-9.42a.9.9 0 0 1 0 1.27l-.99.99a.9.9 0 1 1-1.27-1.27l.99-.99a.9.9 0 0 1 1.27 0ZM7.43 14.67a.9.9 0 0 1 0 1.27l-.99.99A.9.9 0 1 1 5.17 15.66l.99-.99a.9.9 0 0 1 1.27 0Z"/>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M15.1 2.7a.8.8 0 0 0-.9.2 8.7 8.7 0 1 0 7 12.4.8.8 0 0 0-1.15-1 7 7 0 0 1-8.7-9.4.8.8 0 0 0-.3-.95.8.8 0 0 0 .4-.15c1.3-.4 2.6-.4 3.65 0Z"/>
      </svg>
    </button>
  </header>

  <div class="controls">
    <div class="chips-wrap">
      <div class="chips" id="chips" role="group" aria-label="分类"></div>
    </div>
    <label class="search">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 15.5 20 20m-2.2-7.6a6.4 6.4 0 1 1-12.8 0 6.4 6.4 0 0 1 12.8 0Z"/>
      </svg>
      <input type="search" id="search" name="q" placeholder="搜索标题、作者、简介或笔记…" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="搜索标题、作者、简介或笔记">
    </label>
  </div>

  <main class="main">
    <section class="stage" aria-label="收藏卡片">
      <div class="deck" id="deck" tabindex="0"></div>
    </section>

    <div class="browse">
      <button type="button" class="nav-btn nav-prev" id="prevBtn" aria-label="上一张">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M15.2 5.2a1 1 0 0 1 0 1.4L10.42 11.4H19a1 1 0 1 1 0 2h-8.58l4.78 4.8a1 1 0 1 1-1.42 1.4l-6.5-6.5a1 1 0 0 1 0-1.4l6.5-6.5a1 1 0 0 1 1.42 0Z"/></svg>
      </button>
      <div class="pager" id="pager">
        <p class="pager-count" id="pagerCount" aria-live="polite">—</p>
        <div class="pager-track" aria-hidden="true"><span class="pager-thumb" id="pagerThumb"></span></div>
      </div>
      <button type="button" class="nav-btn nav-next" id="nextBtn" aria-label="下一张">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M8.8 5.2a1 1 0 0 1 1.4 0l6.5 6.5a1 1 0 0 1 0 1.4l-6.5 6.5a1 1 0 1 1-1.4-1.4l4.78-4.8H5a1 1 0 1 1 0-2h8.58L8.8 6.6a1 1 0 0 1 0-1.4Z"/></svg>
      </button>
    </div>
  </main>

  <p class="hint" id="hint">点按卡片翻转查看详情，左右滑动或用方向键切换</p>

  <div class="empty" id="empty" hidden>
    <p class="empty-title">没有找到匹配的收藏</p>
    <p class="empty-body">试试其他关键词，或清除搜索后再按分类浏览。</p>
    <button type="button" class="text-btn" id="clearSearch">清除搜索</button>
  </div>

  <dialog class="reader" id="reader" aria-labelledby="readerTitle">
    <form method="dialog" class="reader-head">
      <button type="submit" class="shape-btn reader-close" value="close" aria-label="关闭全文">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.3 6.3a1 1 0 0 1 1.4 0L12 10.58l4.3-4.28a1 1 0 1 1 1.4 1.42L13.42 12l4.28 4.3a1 1 0 1 1-1.42 1.4L12 13.42l-4.3 4.28a1 1 0 1 1-1.4-1.42L10.58 12 6.3 7.7a1 1 0 0 1 0-1.4Z"/></svg>
      </button>
      <div class="reader-head-text">
        <p class="reader-kicker" id="readerKicker"></p>
        <h2 id="readerTitle"></h2>
      </div>
    </form>
    <div class="reader-body" id="readerBody"></div>
    <div class="reader-foot" id="readerFoot"></div>
  </dialog>

  <dialog class="lightbox" id="lightbox" aria-label="查看图片">
    <form method="dialog">
      <button type="submit" class="shape-btn lightbox-close" value="close" aria-label="关闭图片">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.3 6.3a1 1 0 0 1 1.4 0L12 10.58l4.3-4.28a1 1 0 1 1 1.4 1.42L13.42 12l4.28 4.3a1 1 0 1 1-1.42 1.4L12 13.42l-4.3 4.28a1 1 0 1 1-1.4-1.42L10.58 12 6.3 7.7a1 1 0 0 1 0-1.4Z"/></svg>
      </button>
    </form>
    <img id="lightboxImg" alt="">
  </dialog>

  <noscript>
    <p class="noscript">浏览收藏卡需要启用 JavaScript，并用本地服务器打开本页，例如：<code>python3 -m http.server</code>。</p>
  </noscript>

  <script src="js/app.js" defer></script>
</body>
</html>
